    </text>
    <text x="1092" y="458" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="22">
      The project moves from diagnosis to allocation and retention.
    </text>
    <path d="M1110 560C1160 500 1230 470 1296 474C1362 478 1409 522 1440 556" stroke="#173B45" stroke-width="10" stroke-linecap="round"/>
    <path d="M1432 540L1456 572L1418 576" stroke="#173B45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1092" y="540" fill="#C96A3D" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700">
      +55.53%
    </text>
    <text x="1092" y="580" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="21">
      Expected profit uplift under optimized 50% capital allocation
    </text>
    <text x="1092" y="638" fill="#2C6E63" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">
