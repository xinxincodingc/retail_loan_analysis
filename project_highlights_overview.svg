<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F0E8"/>
      <stop offset="1" stop-color="#FFFDFC"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="700" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B45"/>
      <stop offset="1" stop-color="#2C6E63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C96A3D"/>
      <stop offset="1" stop-color="#E8A15B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#173B45" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#C9BAA9">
    <path d="M0 120H1600"/>
    <path d="M0 240H1600"/>
    <path d="M0 360H1600"/>
    <path d="M0 480H1600"/>
    <path d="M0 600H1600"/>
    <path d="M0 720H1600"/>
    <path d="M0 840H1600"/>
    <path d="M200 0V900"/>
    <path d="M400 0V900"/>
    <path d="M600 0V900"/>
    <path d="M800 0V900"/>
    <path d="M1000 0V900"/>
    <path d="M1200 0V900"/>
    <path d="M1400 0V900"/>
  </g>

  <rect x="64" y="56" width="1472" height="788" rx="34" fill="#FFFCF8" filter="url(#shadow)"/>

  <g>
