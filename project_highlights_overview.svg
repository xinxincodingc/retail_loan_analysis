    <text x="150" y="170" fill="#F9F4EE" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">
      Retail Loan Analytics
    </text>
    <text x="150" y="230" fill="#D9ECE8" font-family="'Segoe UI', Arial, sans-serif" font-size="26">
      A full-cycle banking analysis from expansion pace to portfolio action
    </text>
    <text x="150" y="276" fill="#F7D6C2" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">
      Continue, but selective and risk-disciplined
    </text>
  </g>

  <g>
    <rect x="770" y="112" width="320" height="82" rx="20" fill="#F2E2D3"/>
    <text x="804" y="162" fill="#173B45" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">
      2.15M loans x 49 fields
    </text>
    <text x="804" y="200" fill="#5B635F" font-family="'Segoe UI', Arial, sans-serif" font-size="22">
      business + risk + customer lens
    </text>
  </g>

  <g>
    <rect x="1122" y="112" width="360" height="82" rx="20" fill="#E6F1EE"/>
    <text x="1156" y="162" fill="#173B45" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">
