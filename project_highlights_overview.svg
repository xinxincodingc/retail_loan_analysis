    </text>
    <text x="1156" y="200" fill="#5B635F" font-family="'Segoe UI', Arial, sans-serif" font-size="22">
      optimize profit, control tail risk
    </text>
  </g>

  <g>
    <rect x="120" y="360" width="420" height="380" rx="28" fill="#FFF8F1" stroke="#E3D1BF"/>
    <text x="152" y="418" fill="#173B45" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">
      1. Expansion Pace
    </text>
    <text x="152" y="458" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="22">
      Fast early growth created risk, then the book corrected.
    </text>
    <text x="152" y="520" fill="#C96A3D" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">
      99.03% to 6.76%
    </text>
    <text x="152" y="554" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="21">
      Loan-count CAGR from 2012-2015 to 2016-2018
    </text>
    <text x="152" y="602" fill="#2C6E63" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">
      +3.99pp to -9.58pp
    </text>
    <text x="152" y="636" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="21">
      Resolved charge-off change across the two phases
    </text>
    <polyline points="168,690 235,610 302,560 369,575 436,520 503,488"
      fill="none" stroke="#C96A3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="168,710 235,720 302,685 369,640 436,604 503,560"
      fill="none" stroke="#2C6E63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="503" cy="488" r="8" fill="#C96A3D"/>
    <circle cx="503" cy="560" r="8" fill="#2C6E63"/>
    <text x="170" y="736" fill="#8A8178" font-family="'Segoe UI', Arial, sans-serif" font-size="18">
      orange: growth pressure   green: healthier risk path
    </text>
  </g>

