    </text>
    <text x="622" y="520" fill="#173B45" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">
      A to G pricing spread: 18.36pp
    </text>
    <text x="622" y="560" fill="#173B45" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">
      A to G bad-rate spread: 33.19pp
    </text>

    <g transform="translate(630 598)">
      <rect x="0" y="-70" width="34" height="70" rx="10" fill="#DDE8E5"/>
      <rect x="52" y="-90" width="34" height="90" rx="10" fill="#D0DFDB"/>
      <rect x="104" y="-118" width="34" height="118" rx="10" fill="#BFD5CF"/>
      <rect x="156" y="-148" width="34" height="148" rx="10" fill="#A8C6BD"/>
      <rect x="208" y="-178" width="34" height="178" rx="10" fill="#8DB7A9"/>
      <rect x="260" y="-210" width="34" height="210" rx="10" fill="#6D9F8E"/>
      <rect x="312" y="-238" width="34" height="238" rx="10" fill="#2C6E63"/>
      <polyline points="17,-34 69,-50 121,-76 173,-112 225,-150 277,-188 329,-226"
        fill="none" stroke="#C96A3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="4" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">A</text>
      <text x="56" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">B</text>
      <text x="108" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">C</text>
      <text x="160" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">D</text>
      <text x="212" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">E</text>
      <text x="264" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">F</text>
      <text x="316" y="34" fill="#6A6159" font-family="'Segoe UI', Arial, sans-serif" font-size="18">G</text>
    </g>

    <text x="622" y="700" fill="#C96A3D" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700">
      Default-screen recall leader: Logistic Regression at 86.67%
    </text>
    <text x="622" y="730" fill="#2C6E63" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700">
      Churn model winner: Random Forest with AUC 0.9047
    </text>
  </g>

  <g>
    <rect x="1060" y="360" width="420" height="380" rx="28" fill="#FFF9F5" stroke="#E7D4C6"/>
    <text x="1092" y="418" fill="#173B45" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">
